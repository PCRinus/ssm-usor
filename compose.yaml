# The containers of apps/pdf for local development and the flow tests, built from the same
# Dockerfiles as the deployed ones and reached by the API through GOTENBERG_URL=http://localhost:3300
# and SIGNER_URL=http://localhost:3301 in apps/api/.dev.vars (docs/pdf.md).
services:
  gotenberg:
    build: apps/pdf
    container_name: ssm-usor-gotenberg
    # Loopback only: the services take any document they are handed, unauthenticated.
    ports:
      - '127.0.0.1:3300:3000'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 12
  signer:
    build: apps/pdf/signer
    container_name: ssm-usor-signer
    ports:
      - '127.0.0.1:3301:3301'
    healthcheck:
      # The image has no curl.
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:3301/health")',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
