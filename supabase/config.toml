# The local stack, and through the [remotes.*] blocks at the end, each hosted project's settings.
# CI applies the declared properties to a hosted project with `supabase config push`;
# properties this file does not declare are left as they are there.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "ssm-usor-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Auth users are seeded through the Admin API by pnpm seed:admin:local.
[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Registration is Supabase's own signup (ADR 004).
enable_signup = true
enable_anonymous_sign_ins = false
# The SPA's password fields and `newPasswordSchema` in the contracts mirror these.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# An address is confirmed before its account can be used, here as on the hosted projects.
enable_confirmations = true
# How long a recovery link and the portal's emailed sign-in code work. OTP_EXPIRY_MINUTES in
# apps/api's auth-hooks module says the same to the person reading the email.
otp_expiry = 3600
# The hosted project had 8 from the dashboard while SMS codes and the local stack have 6; CI
# pushes this file to hosted, so setting it here keeps the email and SMS code lengths the same.
otp_length = 6

# Tells the owner of an account that its password changed, whoever changed it: from the reset
# link, or from "Profilul meu". It goes through the hook below as
# `password_changed_notification`; the subject and template here are never used.
[auth.email.notification.password_changed]
enabled = true

# Supabase Auth hands every email it would send to the API, which forwards it to the mail
# Worker (ADR 002). Locally the hook points at the API the browser flow tests start
# (apps/api/scripts/e2e-server.ts, port 8797), which keeps emails in memory, so those tests
# cover registration and password reset from the form to the emailed link. To receive these
# emails from a local `pnpm dev` instead, point the uri at port 8787 and restart the stack.
#
# The value below is not a secret: it decodes to "not-a-secret-local-stack-only-32" and only
# signs calls from the local stack to the local API (apps/api/.dev.vars.example has the same).
# It is a literal because the CLI rejects an unset env() here and would fail every local
# command. Each hosted project gets its own from its [remotes.*] block below, never this one.
[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:8797/hooks/supabase/send-email"
secrets = "v1,whsec_bm90LWEtc2VjcmV0LWxvY2FsLXN0YWNrLW9ubHktMzI="

# The portal's sign-in by code (ADR 022). `enable_signup` is Supabase's switch for phone sign-in
# as a whole: phone sign-in cannot be on with signup by phone off, so anyone can have Auth make
# an account for a number. The API's Send SMS hook texts only the accounts it made for an
# invitation (apps/api's auth-hooks module), so a stranger's number gets no SMS.
#
# The code's expiry (`sms_otp_exp`) is not a property of this file: the local stack fixes it at
# 100 minutes, and the deployment workflow sets 10 on the hosted projects.
[auth.sms]
enable_signup = true
# The first code confirms the number, as the first emailed code confirms an address.
enable_confirmations = true
# Never used: the Send SMS hook writes the message.
template = "Your code is {{ .Code }}"
max_frequency = "60s"

# Supabase Auth hands every code it would text to the API, which forwards it to the SMS Worker.
# Locally it points at the flow tests' API (port 8797), which keeps messages in memory, like
# the email hook above. The value below decodes to "not-a-secret-local-sms-hook-only"; the
# hosted projects get their own from their [remotes.*] blocks below.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:8797/hooks/supabase/send-sms"
secrets = "v1,whsec_bm90LWEtc2VjcmV0LWxvY2FsLXNtcy1ob29rLW9ubHk="

# Sign-in with Google (ADR 027). Each environment has its own OAuth client in the Google Cloud
# project `ssm-usor`: production's, and one shared by non-prod and the local stack. CI fills the
# two values from the GitHub environment's secrets; locally they come from supabase/.env, and
# without them the provider stays switched on with an id Google refuses.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Per hour, for the whole project. The default of 30 is less than a client onboarding a floor of
# employees in one afternoon needs, and the cap is what bounds the cost of misuse (ADR 022).
# Emails go through the Send Email hook, which the default of 2 still applies to: the third
# sign-in code of an hour was silently never sent (2026-10-19). One a minute is a floor of
# employees signing in on the same afternoon. `config push` does not manage `email_sent`, so
# the deploy workflow sets it through the Management API (rate_limit_email_sent); the value
# here keeps the local stack the same and documents the choice.
[auth.rate_limit]
sms_sent = 100
email_sent = 60

[realtime]
enabled = false

[storage]
enabled = true
# Generated documents are Word files; the largest sample is under 1 MiB, a PDF a few more.
file_size_limit = "20MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false

# Per hosted project, the CLI picks the block whose project_id is the linked project's. Only what
# must differ from the local values above is listed.
[remotes.production]
project_id = "xvhiwymggufbvjdfywjg"

[remotes.production.auth]
site_url = "https://app.ssmusor.ro"
additional_redirect_urls = ["https://app.ssmusor.ro/auth/callback"]

[remotes.production.auth.hook.send_email]
enabled = true
uri = "https://api.ssmusor.ro/hooks/supabase/send-email"
secrets = "env(SUPABASE_AUTH_HOOK_SECRET)"

[remotes.production.auth.hook.send_sms]
enabled = true
uri = "https://api.ssmusor.ro/hooks/supabase/send-sms"
secrets = "env(SUPABASE_AUTH_SMS_HOOK_SECRET)"

# The same meaning as `enable_confirmations = true` above: the CLI pushes this key to a
# hosted project un-negated, so there it means the opposite of what it means locally
# (supabase/cli#6997). The deployment workflow sets the hosted value again after the push.
[remotes.production.auth.sms]
enable_confirmations = false

[remotes.non-prod]
project_id = "vzgwbdxmimbcqftltmmo"

[remotes.non-prod.auth]
site_url = "https://app.non-prod.ssmusor.ro"
additional_redirect_urls = ["https://app.non-prod.ssmusor.ro/auth/callback"]

[remotes.non-prod.auth.hook.send_email]
enabled = true
uri = "https://api.non-prod.ssmusor.ro/hooks/supabase/send-email"
secrets = "env(SUPABASE_AUTH_HOOK_SECRET)"

[remotes.non-prod.auth.hook.send_sms]
enabled = true
uri = "https://api.non-prod.ssmusor.ro/hooks/supabase/send-sms"
secrets = "env(SUPABASE_AUTH_SMS_HOOK_SECRET)"

# Inverted as in production above (supabase/cli#6997).
[remotes.non-prod.auth.sms]
enable_confirmations = false
