packages:
  - apps/*
  - packages/*

allowBuilds:
  '@posthog/cli': true
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

catalog:
  '@docx-editor.dev/core': 2.26.0
  '@docx-editor.dev/fonts': 2.26.0
  '@docx-editor.dev/react': 2.26.0
  '@lingui/cli': 6.9.1
  '@lingui/core': 6.9.1
  '@lingui/format-po': 6.9.1
  '@lingui/react': 6.9.1
  '@lingui/vite-plugin': 6.10.1
  libphonenumber-js: 1.13.14

# miniflare (under wrangler) and @scalar/json-magic (under orval) pin undici 7.29.1 exactly, which
# has open advisories. Drop this once neither resolves to 7.29.1.
overrides:
  undici@7.29.1: 7.30.1

# The editor paints a solid table line as a filled box at a fractional position, which every
# browser rounds to 0, 1 or 2 screen pixels by where it falls: lines vanished at 80 % zoom in
# Firefox and Safari, and sat thick and thin side by side in Chrome. The patch paints it as a
# CSS border, as the editor already does for dashed and dotted lines, which all three engines
# draw a whole number of pixels thick and never thinner than one. Upstream 2.35.0 still paints
# boxes; check a newer release before carrying this over.
patchedDependencies:
  '@docx-editor.dev/core@2.26.0': patches/@docx-editor.dev__core@2.26.0.patch
