packages:
  - apps/*
  - packages/*

allowBuilds:
  '@posthog/cli': true
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

catalog:
  '@docx-editor.dev/core': 2.26.0
  '@docx-editor.dev/fonts': 2.26.0
  '@docx-editor.dev/react': 2.26.0
  '@lingui/cli': 6.9.1
  '@lingui/core': 6.9.1
  '@lingui/format-po': 6.9.1
  '@lingui/react': 6.9.1
  '@lingui/vite-plugin': 6.9.1
  libphonenumber-js: 1.13.14

# miniflare (under wrangler) and @scalar/json-magic (under orval) pin undici 7.29.1 exactly, which
# has open advisories. Drop this once neither resolves to 7.29.1.
overrides:
  undici@7.29.1: 7.30.1
