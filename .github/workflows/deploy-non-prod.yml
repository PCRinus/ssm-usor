name: Deploy non-prod

# Every push to main deploys non-prod, and only non-prod: production receives a commit through
# deploy-production.yml once non-prod has run it (ADR 025). Pull requests have their own workflow.
on:
  push:
    branches:
      - main
  # Actions → Deploy non-prod → "Run workflow", on main: deploys everything to non-prod whatever
  # changed. For an environment that was wiped, a rotated secret, or a deployment that failed
  # halfway.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-prod:
    name: Non-production
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: non-prod
      sha: ${{ github.sha }}
      everything: ${{ github.event_name == 'workflow_dispatch' }}
      # deploy-production.yml reads these runs too: it releases only a commit one of them
      # succeeded for.
      baseline-workflow: deploy-non-prod.yml
      baseline-filter: branch=main
    secrets: inherit
