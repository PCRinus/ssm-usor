name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Run by hand from the Actions tab, on main: deploys everything whatever changed. For an
  # environment that was wiped, a rotated secret, or a deployment that failed halfway.
  workflow_dispatch:

permissions:
  contents: read

# Serialize entire main runs, including validation, builds, and deployment.
# PR runs use separate groups; their validation jobs cancel superseded checks below.
concurrency:
  group: ci-${{ github.event_name != 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Select affected applications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # To find the last run that deployed.
      actions: read
    outputs:
      api: ${{ steps.select.outputs.api }}
      app: ${{ steps.select.outputs.app }}
      mail: ${{ steps.select.outputs.mail }}
      pdf: ${{ steps.select.outputs.pdf }}
      marketing: ${{ steps.select.outputs.marketing }}
      database: ${{ steps.select.outputs.database }}
      projects: ${{ steps.select.outputs.projects }}
      # Whether this run deploys: a push to main, or a run started by hand on main.
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # A push is compared with the commit of the last run on main that succeeded, not with
      # the push before it: a run that was cancelled, superseded or failed deployed nothing, so
      # what it carried has to be selected again by the next one. Without such a run (or when
      # its commit is gone) the comparison falls back to the push before.
      - name: Find the last commit that was deployed
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [[ -n "$sha" ]] && git fetch --no-tags --depth=1 origin "$sha" 2>/dev/null; then
            echo "Comparing with $sha, the last commit a run on main succeeded for."
            echo "base=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "No usable successful run; comparing with the push before this one."
            echo "base=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes across the PR or since the last deployment
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # PRs use GitHub's changed-file list instead, whatever the base.
          base: ${{ steps.baseline.outputs.base || github.ref }}
          filters: .github/filters.yml

      # The database filter selects its own job, not a deployable workspace. A run started by
      # hand selects everything.
      - name: Select deployable applications
        id: select
        env:
          EVERYTHING: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        shell: bash
        run: |
          all='["api","app","mail","pdf","marketing","database"]'
          if [[ "$EVERYTHING" == true ]]; then CHANGES=$all; fi
          for name in $(jq -r '.[]' <<< "$all"); do
            echo "$name=$(jq --arg name "$name" 'index($name) != null' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"
          done
          echo "projects=$(jq -c 'map(select(. != "database" and . != "templates"))' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate repository
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-validate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'

      - name: Check generated API contract and client
        run: pnpm check:generated

      - name: Lint and check formatting
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set up Supabase CLI
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.api == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Check migrations, policies, and generated database types
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.api == 'true'
        shell: bash
        run: |
          supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime
          supabase test db
          pnpm generate:db
          if ! git diff --exit-code -- apps/api/src/database.types.ts; then
            echo "apps/api/src/database.types.ts is stale. Run pnpm generate:db and commit the result."
            exit 1
          fi

      # PRs check packaging without production environment access. Main builds
      # happen once in the production build job, with the real public settings.
      - name: Build and validate affected PR applications
        if: github.event_name == 'pull_request' && needs.changes.outputs.projects != '[]'
        env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
        shell: bash
        run: |
          mapfile -t projects < <(jq -r '.[]' <<< "$PROJECTS")
          filters=()
          for project in "${projects[@]}"; do
            filters+=("--filter=@ssm-usor/$project")
          done
          pnpm exec turbo run deploy:dry-run "${filters[@]}"

  # Browser flows that create users: invitations, member management, passwords. They run
  # against a throwaway local stack (local Supabase, the API served by Node with an in-memory
  # mailer, a preview build of the SPA), never against production, and sit beside validation
  # rather than in front of any deployment.
  flows:
    name: Browser flow tests
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-flows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: flows

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start the local Supabase stack
        run: supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ssm-usor/app exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install --with-deps chromium

      - name: Install Chromium's system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install-deps chromium

      # The API's e2e server imports both packages from their build output.
      - name: Build the contracts and the document engine
        run: pnpm --filter @ssm-usor/contracts --filter @ssm-usor/document-engine build

      # Generating documents reads the templates from Storage.
      - name: Register the document templates in the local stack
        run: pnpm templates:register:local

      # The image apps/pdf deploys, so issuing makes real PDFs in the flows.
      - name: Start the PDF converter
        run: |
          image=$(grep -m1 '^FROM ' apps/pdf/Dockerfile | cut -d' ' -f2)
          docker run -d --name gotenberg -p 3300:3000 "$image"
          timeout 120 bash -c 'until curl -sf localhost:3300/health >/dev/null; do sleep 1; done'

      - name: Run the browser flows
        env:
          GOTENBERG_URL: http://localhost:3300
        run: pnpm --filter @ssm-usor/app test:e2e:flows

      - name: Upload the flow test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flows
          path: |
            apps/app/playwright-report-flows/
            apps/app/test-results-flows/
          retention-days: 7
          overwrite: true

  build:
    name: Build production ${{ matrix.project }}
    # Alongside validation, to keep it off the critical path. Nothing built here is deployed
    # unless validation succeeds too: every deployment job needs both.
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      GIT_COMMIT_SHA: ${{ github.sha }}
      VITE_API_URL: https://api.ssmusor.ro
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Optional: without it the marketing waitlist form falls back to a mailto link.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Check public application configuration
        if: matrix.project == 'app' || matrix.project == 'api'
        shell: bash
        run: |
          : "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in GitHub variables}"
          if [[ "$VITE_SUPABASE_URL" != https://* || "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "Set an HTTPS Supabase URL and an sb_publishable_ key."
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: build-${{ matrix.project }}

      - name: Build and validate Cloudflare package
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec turbo run deploy:dry-run --filter="@ssm-usor/$PROJECT"

      - name: Collect release files
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp -R "apps/$PROJECT/.wrangler/deploy" "$RUNNER_TEMP/release/worker"
          if [[ "$PROJECT" != api && "$PROJECT" != mail && "$PROJECT" != pdf ]]; then
            cp -R "apps/$PROJECT/dist" "$RUNNER_TEMP/release/dist"
          fi

      - name: Upload validated release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.project }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy-database:
    name: Deploy database migrations
    needs: [changes, validate]
    if: needs.changes.outputs.deploy == 'true' && needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check database deployment configuration
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set SUPABASE_ACCESS_TOKEN in GitHub secrets}"
          : "${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in GitHub secrets}"
          : "${SUPABASE_PROJECT_ID:?Set SUPABASE_PROJECT_ID in GitHub variables}"
          : "${SUPABASE_AUTH_HOOK_SECRET:?Set SUPABASE_AUTH_HOOK_SECRET in GitHub secrets}"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # Forward-only: a bad migration is fixed by a corrective migration, never rolled back.
      - name: Apply pending migrations to the hosted project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

  deploy-templates:
    name: Register document templates
    needs: [changes, validate, deploy-database]
    # On every push to main, not on a path filter: the filter compares with the push before,
    # so a run that is superseded while it waits would leave its templates unregistered.
    # Registering is cheap when nothing changed.
    # After the migrations: the registry and the bucket come from one. A skipped migration job
    # is fine only when the database was not selected.
    if: >-
      !cancelled() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.validate.result == 'success' &&
      (needs.deploy-database.result == 'success' ||
        (needs.deploy-database.result == 'skipped' && needs.changes.outputs.database != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: register-document-templates
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check template registration settings
        shell: bash
        run: |
          : "${SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in GitHub secrets}"

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # A file already in Storage is not sent again, and a hash already registered stays the
      # version it was, so this does nothing when no template changed.
      - name: Upload and register the built-in templates
        run: pnpm templates:register

  deploy-pdf:
    name: Deploy PDF Worker
    needs: [changes, validate, build]
    if: needs.changes.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-pdf-${{ github.sha }}
          path: apps/pdf/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      # Besides the Worker, this builds the container image from apps/pdf/Dockerfile with the
      # runner's Docker and pushes it to Cloudflare's registry, which the API token must be
      # allowed to do (docs/pdf.md).
      - name: Deploy validated PDF bundle and its container image
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pdf
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ github.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  deploy-mail:
    name: Deploy mail Worker
    needs: [changes, validate, build]
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-mail-${{ github.sha }}
          path: apps/mail/.wrangler/release

      - name: Report missing provider key
        if: env.RESEND_API_KEY == ''
        run: echo "::warning::RESEND_API_KEY is not set. The mail Worker will log emails instead of sending them."

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated mail bundle
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mail
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ github.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          # Uploaded only once the key exists, so the Worker can ship before the Resend account does.
          secrets: ${{ env.RESEND_API_KEY != '' && 'RESEND_API_KEY' || '' }}

  deploy-api:
    name: Deploy API
    needs: [changes, validate, build, deploy-database, deploy-mail, deploy-pdf]
    # Migrations and the mail Worker land before code that depends on them: the API's
    # service binding cannot deploy against a Worker that does not exist. Skipped jobs are fine.
    if: >-
      !cancelled() &&
      needs.changes.outputs.api == 'true' &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-database.result == 'success' || needs.deploy-database.result == 'skipped') &&
      (needs.deploy-mail.result == 'success' || needs.deploy-mail.result == 'skipped') &&
      (needs.deploy-pdf.result == 'success' || needs.deploy-pdf.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.ssmusor.ro
    env:
      E2E_API_URL: https://api.ssmusor.ro
      E2E_APP_URL: https://app.ssmusor.ro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-api-${{ github.sha }}
          path: apps/api/.wrangler/release

      # Routes answer 503 until the secret they need exists, so a missing one warns instead of failing.
      - name: Select configured API secrets
        id: secrets
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
        shell: bash
        run: |
          {
            echo 'names<<EOF'
            for name in SUPABASE_SECRET_KEY TURNSTILE_SECRET_KEY SUPABASE_AUTH_HOOK_SECRET; do
              if [[ -n "${!name}" ]]; then
                echo "$name"
              else
                echo "::warning::$name is not set. The routes that need it will answer 503." >&2
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated API bundle
        uses: cloudflare/wrangler-action@v4
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
          # Issued documents get their PDF from apps/pdf. Set here and not in wrangler.jsonc,
          # so that `wrangler dev`, where nothing answers that binding, issues without one.
          PDF_CONVERSION: service
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ github.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          vars: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            PDF_CONVERSION
          secrets: ${{ steps.secrets.outputs.names }}

      - name: Check deployed API and browser access
        id: api-checks
        run: pnpm --filter @ssm-usor/app test:e2e --project=api

      - name: Upload API test report
        if: ${{ !cancelled() && steps.api-checks.outcome != 'skipped' && steps.api-checks.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-api
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
          overwrite: true

  deploy-auth-config:
    name: Deploy Supabase configuration
    needs: [changes, validate, deploy-api]
    # After the API: the Send Email hook must not point at an endpoint that is not deployed yet.
    # A skipped API deployment is fine only when the API was not selected; when it was selected
    # and skipped, something before it failed and the endpoint may be missing.
    if: >-
      !cancelled() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.changes.outputs.database == 'true' &&
      needs.validate.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
        (needs.deploy-api.result == 'skipped' && needs.changes.outputs.api != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # Read by supabase/config.toml through env(); the API holds the same value.
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration deployment settings
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set SUPABASE_ACCESS_TOKEN in GitHub secrets}"
          : "${SUPABASE_PROJECT_ID:?Set SUPABASE_PROJECT_ID in GitHub variables}"
          : "${SUPABASE_AUTH_HOOK_SECRET:?Set SUPABASE_AUTH_HOOK_SECRET in GitHub secrets}"
          grep -q "project_id = \"$SUPABASE_PROJECT_ID\"" supabase/config.toml \
            || { echo "::error::supabase/config.toml has no [remotes] block for $SUPABASE_PROJECT_ID, so the local values would be pushed."; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # The push below does not ask for confirmation here, so the log keeps what it changed.
      - name: Show what the push will change
        run: supabase config diff --project-ref "$SUPABASE_PROJECT_ID"

      # Only properties config.toml declares are written; the rest of the hosted
      # configuration is left as it is.
      - name: Apply supabase/config.toml to the hosted project
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

  deploy-app:
    name: Deploy SPA
    needs: [changes, validate, build, deploy-api]
    # Explicitly allow a skipped API job on SPA-only releases, but never a failed one.
    if: >-
      !cancelled() &&
      needs.changes.outputs.app == 'true' &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
        (needs.deploy-api.result == 'skipped' && needs.changes.outputs.api != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.ssmusor.ro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-app-${{ github.sha }}
          path: apps/app/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated SPA assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          command: >-
            deploy --assets .wrangler/release/dist
            --tag ${{ github.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  # Separate from the deployment, which is done and reported by the time this starts. The
  # checks run against production with a real account, so they stay small; flows that create
  # users or send email are tested against a local stack on pull requests instead.
  verify-app:
    name: Verify deployed SPA
    needs: [changes, deploy-app]
    if: ${{ !cancelled() && needs.deploy-app.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      E2E_API_URL: https://api.ssmusor.ro
      E2E_APP_URL: https://app.ssmusor.ro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The browser download is cached by Playwright version; its system packages are not.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ssm-usor/app exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install --with-deps chromium

      - name: Install Chromium's system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install-deps chromium

      - name: Check deployed SPA and authenticated user flow
        id: app-checks
        # Advisory during development; the deployment completed in the job before this one.
        continue-on-error: true
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm --filter @ssm-usor/app test:e2e --project=chromium --project=authenticated

      - name: Report browser verification warning
        if: ${{ !cancelled() && steps.app-checks.outcome == 'failure' }}
        run: |
          echo "::warning::SPA deployed, but browser verification did not pass. Review the Playwright results."
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ### Browser verification warning

          The SPA was deployed, but the Playwright browser checks did not pass.
          These checks are currently advisory. Review the test logs and the `playwright-app`
          artifact, if available, before treating this release as verified.
          MARKDOWN

      - name: Upload browser test report
        if: ${{ !cancelled() && steps.app-checks.outcome != 'skipped' && steps.app-checks.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-app
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
          overwrite: true

  deploy-marketing:
    name: Deploy marketing site
    needs: [changes, validate, build]
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ssmusor.ro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-marketing-${{ github.sha }}
          path: apps/marketing/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated marketing bundle and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/worker.js --no-bundle
            --assets .wrangler/release/dist
            --tag ${{ github.sha }}
            --message "${{ steps.metadata.outputs.message }}"
