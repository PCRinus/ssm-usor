name: Seed database

# Operator action, run by hand: ensures the admin user, its organization, and optionally
# fake clients with employees on one environment's Supabase project. Never part of a release.
# An existing admin account keeps its password unless reset-password is set.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment whose project to seed
        type: choice
        options:
          - non-prod
          - production
        default: non-prod
      fake:
        description: Also upsert fake clients and their employees (only where SEED_ALLOW_FAKE is set)
        type: boolean
        default: false
      clients:
        description: Number of fake clients
        type: number
        default: 25
      seed:
        description: Faker seed value (same value, same data)
        type: number
        default: 20260917
      reset-password:
        description: Set SEED_ADMIN_PASSWORD on the existing admin account
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seed-database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed hosted project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_ADMIN_EMAIL_INPUT: ${{ vars.SEED_ADMIN_EMAIL }}
      SEED_ORGANIZATION_NAME_INPUT: ${{ vars.SEED_ORGANIZATION_NAME }}
      SEED_ADMIN_NAME_INPUT: ${{ vars.SEED_ADMIN_NAME }}
      SEED_ALLOW_FAKE: ${{ vars.SEED_ALLOW_FAKE }}
    steps:
      # The seed script and the packages it builds are those of the ref the run starts on, and
      # production runs main's code only (ADR 025).
      - name: Check the branch
        if: inputs.environment == 'production'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Seed production from main only, not from $GITHUB_REF."
            exit 1
          fi

      # Without the secret the seed script falls back to the local stack's password, which this
      # public repository prints, and would give it to a newly created admin account.
      - name: Check seed configuration
        shell: bash
        run: |
          : "${SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in GitHub secrets}"
          : "${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in GitHub secrets for this environment}"
          if [[ "${{ inputs.fake }}" == "true" && "$SEED_ALLOW_FAKE" != "true" ]]; then
            echo "Fake data is not allowed in this environment. Set SEED_ALLOW_FAKE=true to permit it."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The seed imports these packages from their built output, not their sources.
      - name: Build the API's workspace packages
        run: pnpm --filter "@ssm-usor/api^..." build

      # Optional variables are exported only when set, so the script's defaults apply otherwise.
      - name: Run the seed
        shell: bash
        run: |
          [[ -n "$SEED_ADMIN_EMAIL_INPUT" ]] && export SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL_INPUT"
          [[ -n "$SEED_ORGANIZATION_NAME_INPUT" ]] && export SEED_ORGANIZATION_NAME="$SEED_ORGANIZATION_NAME_INPUT"
          [[ -n "$SEED_ADMIN_NAME_INPUT" ]] && export SEED_ADMIN_NAME="$SEED_ADMIN_NAME_INPUT"
          args=()
          if [[ "${{ inputs.fake }}" == "true" ]]; then
            args+=(--fake --clients "${{ inputs.clients }}" --seed "${{ inputs.seed }}")
          fi
          if [[ "${{ inputs.reset-password }}" == "true" ]]; then
            args+=(--reset-password)
          fi
          pnpm --filter @ssm-usor/api seed "${args[@]}"
