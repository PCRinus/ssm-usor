name: Release
run-name: Release ${{ inputs.tag || github.event.release.tag_name }}

# Publishing a GitHub release deploys the commit of its tag to production (ADR 025). Tags are
# dates: 2026.10.23, and 2026.10.23.2 for a second release that day.
on:
  release:
    types:
      - published
  # Actions → Release → "Run workflow": deploys everything to production whatever changed, for
  # a wiped environment, a rotated secret, or a release that failed halfway.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy, such as 2026.10.23
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the non-prod deployment of the commit.
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Production only receives what non-prod has run. A successful run of deploy.yml for the
      # commit means non-prod has everything up to it, since each run deploys what the runs
      # before it left undeployed. A run by hand may be started from any branch, so the
      # commit is looked up from the tag, never taken from the run.
      - name: Check that non-prod has deployed the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag such as 2026.10.23 or 2026.10.23.2."
            exit 1
          fi
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha); then
            echo "::error::There is no tag $TAG."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$TAG is $sha, which is not on main."
            exit 1
          fi
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$sha&branch=main&status=success&per_page=1" \
            --jq '.total_count')
          if [[ "$deployed" == 0 ]]; then
            echo "::error::No run of Deploy succeeded for $sha, so non-prod has not run it. Release a commit it has run."
            exit 1
          fi
          echo "Releasing $TAG, $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  production:
    name: Production
    needs: check
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      sha: ${{ needs.check.outputs.sha }}
      everything: ${{ github.event_name == 'workflow_dispatch' }}
      # Runs by hand are left out: their head_sha is the branch they were started from, not the
      # tag they deployed. Comparing with an earlier release instead only selects more.
      baseline-workflow: release.yml
      baseline-filter: event=release
    secrets: inherit
