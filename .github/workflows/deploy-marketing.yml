name: Deploy marketing site

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-marketing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy marketing site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ssmusor.ro

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare deployment metadata
        id: metadata
        shell: bash
        run: |
          tag="$(git rev-parse --short=12 HEAD)"
          subject="$(git log -1 --pretty=%s | LC_ALL=C tr -cd '[:alnum:] ._:/@+-' | cut -c1-240)"

          if [[ -z "$subject" ]]; then
            subject="Deploy commit $tag"
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'message=CI: %s [%s]\n' "$subject" "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm --filter @ssm-usor/marketing build

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          packageManager: pnpm
          command: >-
            deploy
            --tag "${{ steps.metadata.outputs.tag }}"
            --message "${{ steps.metadata.outputs.message }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
