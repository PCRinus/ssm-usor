name: Deploy

# Every push to main deploys non-prod, and only non-prod: production receives a commit through
# release.yml once non-prod has run it (ADR 025). Pull requests have their own workflow.
on:
  push:
    branches:
      - main
  # Actions → Deploy → "Run workflow", on main: deploys everything to non-prod whatever changed.
  # For an environment that was wiped, a rotated secret, or a deployment that failed halfway.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-prod:
    name: Non-production
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: non-prod
      sha: ${{ github.sha }}
      everything: ${{ github.event_name == 'workflow_dispatch' }}
      # release.yml reads these runs too: a release is refused unless one of them succeeded for
      # its commit.
      baseline-workflow: deploy.yml
      baseline-filter: branch=main
    secrets: inherit
