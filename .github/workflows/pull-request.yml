name: Pull request

# What a pull request has to pass. Nothing here deploys, and nothing here has access to
# production: the deployment workflow runs on main. Each job pays its own checkout and install,
# so the checks live in few jobs, and the slow starts inside them overlap.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request replaces the run of the older one.
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected applications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      portal: ${{ steps.filter.outputs.portal }}
      api: ${{ steps.filter.outputs.api }}
      database: ${{ steps.filter.outputs.database }}
      pdf: ${{ steps.filter.outputs.pdf }}
      code: ${{ steps.filter.outputs.code }}
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v7

      # GitHub's list of the files the pull request changes.
      - name: Detect changes across the pull request
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters.yml

      # Only the deployable workspaces; the other filters select checks, not applications.
      - name: Select deployable applications
        id: projects
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        shell: bash
        run: |
          echo "projects=$(jq -c 'map(select(IN("api", "app", "portal", "mail", "sms", "pdf", "legislation", "marketing", "help")))' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate repository
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The merge commit and its first parent, the base branch, which the help check compares with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'

      # Warns, never fails: most changes to a source do not change what a member sees (ADR 028).
      - name: Name help articles whose sources changed
        continue-on-error: true
        run: pnpm --filter @ssm-usor/help check:sources HEAD^1

      # A change that touches no code, which in practice means documentation, is only checked
      # for formatting and lint.
      - uses: ./.github/actions/validate
        with:
          mode: ${{ needs.changes.outputs.code == 'true' && 'full' || 'light' }}
          database: ${{ needs.changes.outputs.database == 'true' || needs.changes.outputs.api == 'true' }}
          projects: ${{ needs.changes.outputs.projects }}

      # The signer container's Python service (apps/pdf/signer), which pnpm test does not reach.
      - name: Set up Python for the signer
        if: needs.changes.outputs.pdf == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pdf/signer/requirements-dev.txt

      - name: Lint and test the signer
        if: needs.changes.outputs.pdf == 'true'
        run: |
          pnpm --filter @ssm-usor/pdf setup:signer
          apps/pdf/signer/.venv/bin/ruff format --check apps/pdf/signer
          apps/pdf/signer/.venv/bin/ruff check apps/pdf/signer
          pnpm --filter @ssm-usor/pdf test:signer

  # Beside validation rather than inside it: the tests alone take about as long as every other
  # check together.
  test:
    name: Run tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: test

      - name: Test
        run: pnpm test

  # Browser flows that create users: invitations, member management, passwords, documents.
  # They run against a throwaway local stack (local Supabase, the API served by Node with an
  # in-memory mailer, a preview build of the SPA), never against production. They run here
  # and not again after the merge: the deployment does not wait for them, and repeating them
  # there took six runner minutes a merge for what this run has already shown.
  flows:
    name: Browser flow tests
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.portal == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOCAL_SUPABASE_URL: http://127.0.0.1:54321
      LOCAL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # The three slow parts do not depend on one another: the Supabase containers, the download
      # of the PDF converter's image (the one apps/pdf deploys, so issuing makes real PDFs), and
      # further down the browser. The first two go on in the background from here. The
      # converter is only downloaded here and started once Supabase is up: Docker fails to set
      # up a container's networking when two containers are started at the same moment.
      - name: Start the local Supabase stack and download the PDF converter in the background
        shell: bash
        run: |
          # shellcheck disable=SC2016
          nohup bash -c '
            supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime \
              > "$RUNNER_TEMP/supabase-start.log" 2>&1
            echo $? > "$RUNNER_TEMP/supabase-start.exit"
          ' > /dev/null 2>&1 &
          image=$(grep -m1 '^FROM ' apps/pdf/Dockerfile | cut -d' ' -f2)
          nohup docker pull --quiet "$image" > "$RUNNER_TEMP/gotenberg-pull.log" 2>&1 &

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: flows

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ssm-usor/app exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install --with-deps chromium

      - name: Install Chromium's system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install-deps chromium

      # The API's e2e server imports these packages from their build output.
      - name: Build the contracts, the document engine and the import package
        run: pnpm --filter @ssm-usor/contracts --filter @ssm-usor/document-engine --filter @ssm-usor/import build

      # The builds the flows serve bake in the local stack's address and publishable key. Both
      # are the pinned CLI's defaults, so the builds need not wait for the stack, which the step
      # after it is up checks. The other values are the ports of the playwright.flows.config.ts
      # files.
      - name: Build the SPA and the portal while the local stack starts
        env:
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.LOCAL_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: http://localhost:8797
        run: |
          VITE_HELP_URL=http://localhost:4331 pnpm --filter @ssm-usor/app exec vite build --outDir dist-e2e --logLevel warn
          pnpm --filter @ssm-usor/portal exec vite build --outDir dist-e2e --logLevel warn

      - name: Wait for the local Supabase stack
        shell: bash
        run: |
          # shellcheck disable=SC2016
          timeout 600 bash -c 'until [[ -f "$RUNNER_TEMP/supabase-start.exit" ]]; do sleep 2; done' || true
          if [[ "$(cat "$RUNNER_TEMP/supabase-start.exit" 2>/dev/null)" != 0 ]]; then
            echo "The local Supabase stack did not start:"
            cat "$RUNNER_TEMP/supabase-start.log" || true
            exit 1
          fi

      # Without E2E_PREBUILT the flows build again with what the stack reports.
      - name: Use the early builds if the local stack matches them
        shell: bash
        run: |
          status=$(supabase status --output json | sed -n '/^{/,$p')
          if [[ "$(jq -r .API_URL <<< "$status")" == "$LOCAL_SUPABASE_URL" &&
                "$(jq -r .PUBLISHABLE_KEY <<< "$status")" == "$LOCAL_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "E2E_PREBUILT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::The local stack's address or publishable key is not the default; the flows build the SPA and the portal again."
          fi

      # Generating documents reads the templates from Storage.
      - name: Register the document templates in the local stack
        run: pnpm templates:register:local

      # `docker run` waits for the download above if it is still going, or does it itself.
      - name: Start the PDF converter
        shell: bash
        run: |
          image=$(grep -m1 '^FROM ' apps/pdf/Dockerfile | cut -d' ' -f2)
          docker run -d --name gotenberg -p 3300:3000 "$image"
          if ! timeout 180 bash -c 'until curl -sf localhost:3300/health >/dev/null; do sleep 1; done'; then
            echo "The PDF converter did not start:"
            cat "$RUNNER_TEMP/gotenberg-pull.log" || true
            docker logs gotenberg || true
            exit 1
          fi

      - name: Run the browser flows
        if: >-
          needs.changes.outputs.app == 'true' ||
          needs.changes.outputs.api == 'true' ||
          needs.changes.outputs.database == 'true'
        env:
          GOTENBERG_URL: http://localhost:3300
        run: pnpm --filter @ssm-usor/app test:e2e:flows

      # After the app's: both serve the API on the port the local stack's hooks call.
      - name: Run the portal's browser flows
        if: >-
          !cancelled() && (
            needs.changes.outputs.portal == 'true' ||
            needs.changes.outputs.api == 'true' ||
            needs.changes.outputs.database == 'true'
          )
        run: pnpm --filter @ssm-usor/portal test:e2e:flows

      - name: Upload the flow test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flows
          path: |
            apps/app/playwright-report-flows/
            apps/app/test-results-flows/
            apps/portal/playwright-report-flows/
            apps/portal/test-results-flows/
          retention-days: 7
          overwrite: true
