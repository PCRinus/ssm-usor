name: Deploy app

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-app
  # Let both Workers finish deploying before another release starts.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and SPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: app-production
      url: https://app.ssmusor.ro
    env:
      VITE_API_URL: https://api.ssmusor.ro
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7

      - name: Check public app configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in GitHub variables}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in GitHub secrets}"
          : "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in GitHub variables}"
          if [[ "$VITE_API_URL" != https://* || "$VITE_SUPABASE_URL" != https://* || "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "Set HTTPS API and Supabase URLs, and an sb_publishable_ key."
            exit 1
          fi

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm check:generated
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build API and SPA with public Supabase configuration
        run: pnpm exec turbo build --filter=@ssm-usor/app --filter=@ssm-usor/api

      - name: Deploy API
        uses: cloudflare/wrangler-action@v4
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy --tag ${{ github.sha }}
          vars: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY

      - name: Check deployed API and browser access
        run: node scripts/smoke-deployment.mjs api "$VITE_API_URL" https://app.ssmusor.ro

      - name: Deploy SPA
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          command: deploy --tag ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check deployed SPA and direct dashboard navigation
        run: node scripts/smoke-deployment.mjs app https://app.ssmusor.ro
