name: Deploy app

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-app
  # Let both Workers finish deploying before another release starts.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and SPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.ssmusor.ro
    env:
      VITE_API_URL: https://api.ssmusor.ro
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_API_URL: https://api.ssmusor.ro
      E2E_APP_URL: https://app.ssmusor.ro

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7

      - name: Check public app configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in GitHub variables}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in GitHub secrets}"
          : "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in GitHub variables}"
          if [[ "$VITE_API_URL" != https://* || "$VITE_SUPABASE_URL" != https://* || "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "Set HTTPS API and Supabase URLs, and an sb_publishable_ key."
            exit 1
          fi

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for deployment checks
        run: pnpm --filter @ssm-usor/app exec playwright install --with-deps chromium

      - name: Validate release
        run: |
          pnpm check:generated
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build API and SPA with public Supabase configuration
        run: pnpm exec turbo build --filter=@ssm-usor/app --filter=@ssm-usor/api

      - name: Deploy API
        uses: cloudflare/wrangler-action@v4
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy --tag ${{ github.sha }}
          vars: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY

      - name: Check deployed API and browser access
        id: api-checks
        run: pnpm --filter @ssm-usor/app test:e2e --project=api

      - name: Upload API test report
        if: ${{ !cancelled() && steps.api-checks.outcome != 'skipped' && steps.api-checks.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7

      - name: Deploy SPA
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          command: deploy --tag ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check deployed SPA and authenticated user flow
        id: app-checks
        # Advisory during development; deployment has already completed.
        continue-on-error: true
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm --filter @ssm-usor/app test:e2e --project=chromium --project=authenticated

      - name: Report browser verification warning
        if: ${{ !cancelled() && steps.app-checks.outcome == 'failure' }}
        run: |
          echo "::warning::API and SPA deployed, but browser verification did not pass. Review the Playwright results."
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ### Browser verification warning

          The API and SPA were deployed, but the Playwright browser checks did not pass.
          These checks are currently advisory. Review the test logs and the `playwright-app`
          artifact, if available, before treating this release as verified.
          MARKDOWN

      - name: Upload browser test report
        if: ${{ !cancelled() && steps.app-checks.outcome != 'skipped' && steps.app-checks.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-app
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
