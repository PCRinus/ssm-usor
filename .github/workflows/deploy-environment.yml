name: Deploy an environment

# Everything that deploys one environment (ADR 025): deploy-non-prod.yml calls it for non-prod on
# every push to main, deploy-production.yml for production when it is run by hand. One workflow
# for both, so what non-prod tries is what production runs. Each job pays its own checkout and
# install, which is why the builds share one job and why nothing runs that has nothing to do.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, `non-prod` or `production`.
        type: string
        required: true
      sha:
        description: The commit to deploy.
        type: string
        required: true
      everything:
        description: Deploy everything, whatever changed.
        type: boolean
        default: false
      baseline:
        description: The commit last deployed, when the caller knows it better than a run's head.
        type: string
        default: ''
      release:
        description: The release tag the SPA and the portal show as their version, instead of the commit.
        type: string
        default: ''
      baseline-workflow:
        description: Without `baseline`, the workflow whose last successful run's commit is compared with.
        type: string
        default: ''
      baseline-filter:
        description: Query parameters that narrow those runs, such as `branch=main`.
        type: string
        default: ''

permissions:
  contents: read

# Production is the top level of every wrangler.jsonc, so it is the empty name. Set for the whole
# workflow rather than as `--env` on each command: wrangler-action uploads secrets with a
# `wrangler secret bulk` of its own, which a flag in `command` never reaches, and without the
# environment that upload would land on production's Worker. The empty value is not the same as
# unset: wrangler then stops warning that the file defines several environments.
env:
  CLOUDFLARE_ENV: ${{ inputs.environment != 'production' && inputs.environment || '' }}

# No queue across the workflow. Runs used to wait for one another from start to finish, so
# three merges in a row meant three full runs. Now a newer run cancels an older one that is
# still validating or building, which has deployed nothing yet; each deployment job has a group
# of its own that is never cancelled, so nothing is interrupted halfway and the same thing is
# never deployed twice at once. What a cancelled run carried is selected again by the next one,
# because the comparison below is with the last run that succeeded. Every group names the
# environment, so non-prod and production never wait for or cancel each other.

jobs:
  changes:
    name: Select affected applications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the last run that deployed.
      actions: read
    outputs:
      api: ${{ steps.select.outputs.api }}
      app: ${{ steps.select.outputs.app }}
      portal: ${{ steps.select.outputs.portal }}
      mail: ${{ steps.select.outputs.mail }}
      sms: ${{ steps.select.outputs.sms }}
      pdf: ${{ steps.select.outputs.pdf }}
      legislation: ${{ steps.select.outputs.legislation }}
      marketing: ${{ steps.select.outputs.marketing }}
      help: ${{ steps.select.outputs.help }}
      database: ${{ steps.select.outputs.database }}
      templates: ${{ steps.select.outputs.templates }}
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The commit is compared with the commit of the caller's last run that succeeded, not with
      # the push or release before it: a run that was cancelled, superseded or failed deployed
      # nothing as far as this is concerned, so what it carried is selected again by the next
      # one. Without such a run (or when its commit is gone) a push falls back to the push
      # before, and anything else deploys everything. Production's caller passes the commit it
      # found itself, because a run started by hand has main's head, not what it deployed.
      - name: Find the last commit that was deployed
        id: baseline
        if: ${{ !inputs.everything }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline }}
          RUNS: ${{ inputs.baseline-workflow }}
          FILTER: ${{ inputs.baseline-filter }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          sha=$BASELINE
          source="the commit the caller found last deployed"
          if [[ -z "$sha" && -n "$RUNS" ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RUNS/runs?$FILTER&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
            source="the last commit a run of $RUNS ($FILTER) succeeded for"
          fi
          if [[ -n "$sha" ]] && git fetch --no-tags --depth=1 origin "$sha" 2>/dev/null; then
            echo "Comparing with $sha, $source."
            echo "base=$sha" >> "$GITHUB_OUTPUT"
          elif [[ -n "$BEFORE" ]] && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            echo "No usable successful run; comparing with the push before this one."
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "No usable successful run and no push before; deploying everything."
          fi

      - name: Detect changes since the last deployment
        id: filter
        if: steps.baseline.outputs.base != ''
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.baseline.outputs.base }}
          ref: ${{ inputs.sha }}
          filters: .github/filters.yml

      # One step builds every output, so a selective run and a run of everything cannot drift
      # apart. The database and templates filters select their own jobs, not a deployable
      # workspace.
      - name: Select what to deploy
        id: select
        env:
          EVERYTHING: ${{ inputs.everything || steps.baseline.outputs.base == '' }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        shell: bash
        run: |
          all='["api","app","portal","mail","sms","pdf","legislation","marketing","help","database","templates"]'
          if [[ "$EVERYTHING" == true ]]; then CHANGES=$all; fi
          for name in $(jq -r '.[]' <<< "$all"); do
            echo "$name=$(jq --arg name "$name" 'index($name) != null' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"
          done
          echo "projects=$(jq -c 'map(select(IN("api", "app", "portal", "mail", "sms", "pdf", "legislation", "marketing", "help")))' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate repository
    needs: changes
    # Only when there is something to deploy: a push of documentation alone was validated by
    # its pull request and would spend six minutes here to deploy nothing.
    if: >-
      needs.changes.outputs.projects != '[]' ||
      needs.changes.outputs.database == 'true' ||
      needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer run replaces this one while it has deployed nothing.
    concurrency:
      group: deploy-validate-${{ inputs.environment }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'

      # The pull request validated its own merge result; this validates the commit as it is
      # after everything else that was merged before it. The browser flows are not repeated here.
      - uses: ./.github/actions/validate
        with:
          database: ${{ needs.changes.outputs.database == 'true' || needs.changes.outputs.api == 'true' }}

  test:
    name: Run tests
    # Beside validation rather than inside it, as in the pull request: the tests alone take
    # about as long as every other check together.
    needs: changes
    if: >-
      needs.changes.outputs.projects != '[]' ||
      needs.changes.outputs.database == 'true' ||
      needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-test-${{ inputs.environment }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: test

      - name: Test
        run: pnpm test

  build:
    name: Build applications
    # Alongside validation, to keep it off the critical path. Nothing built here is deployed
    # unless validation and the tests succeed too: every deployment job needs all three. One job
    # for all of them: a job per application repeated the checkout and install for a build of
    # under a minute.
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-build-${{ inputs.environment }}
      cancel-in-progress: true
    env:
      PROJECTS: ${{ needs.changes.outputs.projects }}
      GIT_COMMIT_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.release }}
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_HELP_URL: ${{ vars.HELP_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_SOURCEMAPS_UPLOAD_KEY: ${{ secrets.POSTHOG_SOURCEMAPS_UPLOAD_KEY }}
      # Optional: without it the marketing waitlist form falls back to a mailto link.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      # The same EU project as the SPA, in cookieless mode; without it the site sends nothing.
      PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      PUBLIC_API_URL: ${{ vars.API_URL }}
      PUBLIC_APP_URL: ${{ vars.APP_URL }}
      PUBLIC_SITE_URL: ${{ vars.MARKETING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The marketing site falls back to production's addresses when one is empty, which in
      # non-prod would send its visitors to production without a word, and the SPA built
      # without the help address would drop its help links.
      - name: Check environment addresses
        env:
          APP_URL: ${{ vars.APP_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          MARKETING_URL: ${{ vars.MARKETING_URL }}
        shell: bash
        run: |
          for name in VITE_API_URL APP_URL PORTAL_URL MARKETING_URL VITE_HELP_URL; do
            if [[ "${!name}" != https://* ]]; then
              echo "::error::Set ${name/VITE_/} to an https:// address in this environment's GitHub variables."
              exit 1
            fi
          done

      - name: Check public application configuration
        if: >-
          needs.changes.outputs.app == 'true' ||
          needs.changes.outputs.portal == 'true' ||
          needs.changes.outputs.api == 'true'
        shell: bash
        run: |
          : "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in GitHub variables}"
          if [[ "$VITE_SUPABASE_URL" != https://* || "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "Set an HTTPS Supabase URL and an sb_publishable_ key."
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          cache-scope: build-${{ inputs.environment }}

      - name: Build and validate the Cloudflare packages
        shell: bash
        run: |
          mapfile -t projects < <(jq -r '.[]' <<< "$PROJECTS")
          filters=()
          for project in "${projects[@]}"; do
            filters+=("--filter=@ssm-usor/$project")
          done
          pnpm exec turbo run deploy:dry-run "${filters[@]}"

      # One folder per application, in the shape its deployment job downloads.
      - name: Collect release files
        shell: bash
        run: |
          for project in $(jq -r '.[]' <<< "$PROJECTS"); do
            mkdir -p "$RUNNER_TEMP/release-$project"
            cp -R "apps/$project/.wrangler/deploy" "$RUNNER_TEMP/release-$project/worker"
            if [[ "$project" != api && "$project" != mail && "$project" != sms && "$project" != pdf && "$project" != legislation ]]; then
              cp -R "apps/$project/dist" "$RUNNER_TEMP/release-$project/dist"
            fi
          done

      - name: Upload validated api release
        if: needs.changes.outputs.api == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-api-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-api/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated app release
        if: needs.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-app-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-app/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated portal release
        if: needs.changes.outputs.portal == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-portal-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-portal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated mail release
        if: needs.changes.outputs.mail == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-mail-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-mail/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated sms release
        if: needs.changes.outputs.sms == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-sms-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-sms/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated pdf release
        if: needs.changes.outputs.pdf == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-pdf-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-pdf/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated legislation release
        if: needs.changes.outputs.legislation == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-legislation-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-legislation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated marketing release
        if: needs.changes.outputs.marketing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-marketing-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-marketing/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload validated help release
        if: needs.changes.outputs.help == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-help-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-help/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy-database:
    name: Deploy database migrations
    needs: [changes, validate, test]
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-database-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
      SUPABASE_AUTH_SMS_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_SMS_HOOK_SECRET }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The CLI takes the [remotes.*] block whose project_id is the linked project's. Matching it
      # to the environment's name as well stops a project id copied into the wrong GitHub
      # environment from migrating the other environment's database.
      - name: Check database deployment configuration
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set SUPABASE_ACCESS_TOKEN in GitHub secrets}"
          : "${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in GitHub secrets}"
          : "${SUPABASE_PROJECT_ID:?Set SUPABASE_PROJECT_ID in GitHub variables}"
          : "${SUPABASE_AUTH_HOOK_SECRET:?Set SUPABASE_AUTH_HOOK_SECRET in GitHub secrets}"
          : "${SUPABASE_AUTH_SMS_HOOK_SECRET:?Set SUPABASE_AUTH_SMS_HOOK_SECRET in GitHub secrets}"
          : "${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:?Set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID in GitHub secrets}"
          : "${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:?Set SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET in GitHub secrets}"
          remote=$(python3 -c 'import sys, tomllib; print(tomllib.load(open("supabase/config.toml", "rb")).get("remotes", {}).get(sys.argv[1], {}).get("project_id", ""))' "$ENVIRONMENT")
          if [[ "$remote" != "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is $SUPABASE_PROJECT_ID, but [remotes.$ENVIRONMENT] in supabase/config.toml names ${remote:-no project}."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # Forward-only: a bad migration is fixed by a corrective migration, never rolled back.
      - name: Apply pending migrations to the hosted project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

  deploy-templates:
    name: Register document templates
    needs: [changes, validate, test, deploy-database]
    # When a template, the script or a migration changed since the last deployment. It used to
    # run on every push, as a way around a comparison that lost what superseded runs carried;
    # the comparison no longer does, and a job that does nothing still pays for its setup.
    # After the migrations: the registry and the bucket come from one. A skipped migration job
    # is fine only when the database was not selected.
    if: >-
      !cancelled() &&
      needs.changes.outputs.templates == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.deploy-database.result == 'success' ||
        (needs.deploy-database.result == 'skipped' && needs.changes.outputs.database != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: register-document-templates-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check template registration settings
        shell: bash
        run: |
          : "${SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in GitHub secrets}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      # The script validates each manifest entry with the contracts package, which resolves to
      # its built output.
      - name: Build the contracts package
        run: pnpm --filter @ssm-usor/contracts build

      # A file already in Storage is not sent again, and a hash already registered stays the
      # version it was, so this does nothing when no template changed.
      - name: Upload and register the built-in templates
        run: pnpm templates:register

  deploy-pdf:
    name: Deploy PDF Worker
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-pdf-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-pdf-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/pdf/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      # Besides the Worker, this builds an image for every container class in wrangler.jsonc,
      # Gotenberg from apps/pdf/Dockerfile and the signer from apps/pdf/signer/Dockerfile, with the
      # runner's Docker and pushes them to Cloudflare's registry, which the API token must be
      # allowed to do (docs/pdf.md).
      - name: Deploy validated PDF bundle and its container images
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pdf
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  deploy-mail:
    name: Deploy mail Worker
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.mail == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-mail-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-mail-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/mail/.wrangler/release

      - name: Report missing provider key
        if: env.RESEND_API_KEY == ''
        run: echo "::warning::RESEND_API_KEY is not set. The mail Worker will log emails instead of sending them."

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated mail bundle
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mail
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          # Uploaded only once the key exists, so the Worker can ship before the Resend account does.
          secrets: ${{ env.RESEND_API_KEY != '' && 'RESEND_API_KEY' || '' }}

  deploy-sms:
    name: Deploy SMS Worker
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.sms == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-sms-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      # The account SID and the sender are identifiers, not secrets; the auth token is the secret.
      TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      SMS_FROM: ${{ vars.SMS_FROM }}
      TWILIO_CONFIGURED: ${{ vars.TWILIO_ACCOUNT_SID != '' && secrets.TWILIO_AUTH_TOKEN != '' && vars.SMS_FROM != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-sms-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/sms/.wrangler/release

      - name: Report missing provider settings
        if: env.TWILIO_CONFIGURED != 'true'
        run: echo "::warning::TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and SMS_FROM are not all set. The SMS Worker will log messages instead of sending them."

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated SMS bundle
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sms
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          # All three or none, so the Worker can ship before the Twilio account does. The action
          # drops the blank lines it leaves.
          vars: |
            ${{ env.TWILIO_CONFIGURED == 'true' && 'TWILIO_ACCOUNT_SID' || '' }}
            ${{ env.TWILIO_CONFIGURED == 'true' && 'SMS_FROM' || '' }}
          secrets: ${{ env.TWILIO_CONFIGURED == 'true' && 'TWILIO_AUTH_TOKEN' || '' }}

  deploy-legislation:
    name: Deploy legislation Worker
    needs: [changes, validate, test, build, deploy-database]
    # After the migrations: the check records every run in a table one of them creates. A
    # skipped migration job is fine only when the database was not selected.
    if: >-
      !cancelled() &&
      needs.changes.outputs.legislation == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-database.result == 'success' ||
        (needs.deploy-database.result == 'skipped' && needs.changes.outputs.database != 'true'))
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-legislation-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LEGISLATION_RELAY_CLIENT_ID: ${{ secrets.LEGISLATION_RELAY_CLIENT_ID }}
      LEGISLATION_RELAY_CLIENT_SECRET: ${{ secrets.LEGISLATION_RELAY_CLIENT_SECRET }}
      LEGISLATION_RUN_SECRET: ${{ secrets.LEGISLATION_RUN_SECRET }}
    steps:
      # Without the Supabase pair the cron fails every morning before it can record a run; without
      # the Access token the relay turns away every act.
      - name: Check legislation settings
        shell: bash
        run: |
          : "${SUPABASE_URL:?Set VITE_SUPABASE_URL in GitHub variables}"
          : "${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in GitHub secrets}"
          : "${LEGISLATION_RELAY_CLIENT_ID:?Set LEGISLATION_RELAY_CLIENT_ID in GitHub secrets, from the homelab Terraform output legislation_relay_client_id}"
          : "${LEGISLATION_RELAY_CLIENT_SECRET:?Set LEGISLATION_RELAY_CLIENT_SECRET in GitHub secrets, from the homelab Terraform output legislation_relay_client_secret}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-legislation-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/legislation/.wrangler/release

      - name: Report missing run secret
        if: env.LEGISLATION_RUN_SECRET == ''
        run: echo "::notice::LEGISLATION_RUN_SECRET is not set. The cron runs as usual; a run by hand, POST /run on the Worker's domain, needs the secret on the Worker, and answers 404 until then."

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated legislation bundle
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/legislation
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          vars: |
            SUPABASE_URL
          # The run secret only when set: running the check by hand is optional, and without the
          # secret on the Worker /run answers 404. The action drops the blank line it leaves.
          secrets: |
            SUPABASE_SECRET_KEY
            LEGISLATION_RELAY_CLIENT_ID
            LEGISLATION_RELAY_CLIENT_SECRET
            ${{ env.LEGISLATION_RUN_SECRET != '' && 'LEGISLATION_RUN_SECRET' || '' }}

  deploy-api:
    name: Deploy API
    needs: [changes, validate, test, build, deploy-database, deploy-mail, deploy-sms, deploy-pdf]
    # Migrations and the mail and SMS Workers land before code that depends on them: the API's
    # service bindings cannot deploy against a Worker that does not exist. Skipped jobs are fine.
    if: >-
      !cancelled() &&
      needs.changes.outputs.api == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-database.result == 'success' || needs.deploy-database.result == 'skipped') &&
      (needs.deploy-mail.result == 'success' || needs.deploy-mail.result == 'skipped') &&
      (needs.deploy-sms.result == 'success' || needs.deploy-sms.result == 'skipped') &&
      (needs.deploy-pdf.result == 'success' || needs.deploy-pdf.result == 'skipped')
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-api-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    env:
      E2E_API_URL: ${{ vars.API_URL }}
      E2E_APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-api-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/api/.wrangler/release

      # Routes answer 503 until the secret they need exists, so a missing one warns instead of failing.
      - name: Select configured API secrets
        id: secrets
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
          SUPABASE_AUTH_SMS_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_SMS_HOOK_SECRET }}
          POSTHOG_SUPPORT_SECRET_KEY: ${{ secrets.POSTHOG_SUPPORT_SECRET_KEY }}
          SIGNING_CA_KEY: ${{ secrets.SIGNING_CA_KEY }}
          SIGNING_CA_CERT: ${{ secrets.SIGNING_CA_CERT }}
          SIGNING_KEY_ENCRYPTION_KEY: ${{ secrets.SIGNING_KEY_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OBLIO_CLIENT_ID: ${{ secrets.OBLIO_CLIENT_ID }}
          OBLIO_CLIENT_SECRET: ${{ secrets.OBLIO_CLIENT_SECRET }}
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        shell: bash
        run: |
          {
            echo 'names<<EOF'
            for name in SUPABASE_SECRET_KEY TURNSTILE_SECRET_KEY SUPABASE_AUTH_HOOK_SECRET SUPABASE_AUTH_SMS_HOOK_SECRET POSTHOG_SUPPORT_SECRET_KEY SIGNING_CA_KEY SIGNING_CA_CERT SIGNING_KEY_ENCRYPTION_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OBLIO_CLIENT_ID OBLIO_CLIENT_SECRET AI_GATEWAY_URL AI_GATEWAY_TOKEN; do
              if [[ -n "${!name}" ]]; then
                echo "$name"
              else
                echo "::warning::$name is not set. The routes that need it will answer 503." >&2
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      # `wrangler deploy` refuses a Worker bound to a queue that does not exist. When the lookup
      # fails for another reason, creating fails too, and says why.
      - name: Create the regeneration and import queues if they are missing
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        # Has to match the queues wrangler.jsonc names for the environment.
        run: |
          for name in ssm-usor-regeneration ssm-usor-import ssm-usor-import-dead-letter; do
            queue="$name${CLOUDFLARE_ENV:+-$CLOUDFLARE_ENV}"
            if pnpm exec wrangler queues info "$queue" > /dev/null 2>&1; then
              echo "The queue $queue exists."
            else
              pnpm exec wrangler queues create "$queue"
            fi
          done

      - name: Deploy validated API bundle
        uses: cloudflare/wrangler-action@v4
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
          SUPABASE_AUTH_SMS_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_SMS_HOOK_SECRET }}
          POSTHOG_SUPPORT_SECRET_KEY: ${{ secrets.POSTHOG_SUPPORT_SECRET_KEY }}
          SIGNING_CA_KEY: ${{ secrets.SIGNING_CA_KEY }}
          SIGNING_CA_CERT: ${{ secrets.SIGNING_CA_CERT }}
          SIGNING_KEY_ENCRYPTION_KEY: ${{ secrets.SIGNING_KEY_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OBLIO_CLIENT_ID: ${{ secrets.OBLIO_CLIENT_ID }}
          OBLIO_CLIENT_SECRET: ${{ secrets.OBLIO_CLIENT_SECRET }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          # A GitHub variable, uploaded as a secret so that a repository without it still deploys:
          # the step above selects only the values that are set.
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
          # Issued documents get their PDF from apps/pdf. Set here and not in wrangler.jsonc,
          # so that `wrangler dev`, where nothing answers that binding, issues without one.
          PDF_CONVERSION: service
          # Oblio has no test mode, so only production issues fiscal invoices. Here and not in
          # wrangler.jsonc, whose top level is production's and is what `wrangler dev` reads.
          OBLIO_DOCUMENTS: ${{ inputs.environment == 'production' && 'invoice' || 'proforma' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/index.js --no-bundle
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"
          vars: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            PDF_CONVERSION
            OBLIO_DOCUMENTS
          secrets: ${{ steps.secrets.outputs.names }}

      - name: Check deployed API and browser access
        id: api-checks
        run: pnpm --filter @ssm-usor/app test:e2e --project=api

      - name: Upload API test report
        if: ${{ !cancelled() && steps.api-checks.outcome != 'skipped' && steps.api-checks.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-api
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
          overwrite: true

  deploy-auth-config:
    name: Deploy Supabase configuration
    needs: [changes, validate, test, deploy-api]
    # After the API: the Send Email and Send SMS hooks must not point at an endpoint that is not
    # deployed yet.
    # A skipped API deployment is fine only when the API was not selected; when it was selected
    # and skipped, something before it failed and the endpoint may be missing.
    if: >-
      !cancelled() &&
      needs.changes.outputs.database == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
        (needs.deploy-api.result == 'skipped' && needs.changes.outputs.api != 'true'))
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-auth-config-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # Read by supabase/config.toml through env(); the API holds the same values.
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
      SUPABASE_AUTH_SMS_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_SMS_HOOK_SECRET }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Check configuration deployment settings
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set SUPABASE_ACCESS_TOKEN in GitHub secrets}"
          : "${SUPABASE_PROJECT_ID:?Set SUPABASE_PROJECT_ID in GitHub variables}"
          : "${SUPABASE_AUTH_HOOK_SECRET:?Set SUPABASE_AUTH_HOOK_SECRET in GitHub secrets}"
          : "${SUPABASE_AUTH_SMS_HOOK_SECRET:?Set SUPABASE_AUTH_SMS_HOOK_SECRET in GitHub secrets}"
          : "${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:?Set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID in GitHub secrets}"
          : "${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:?Set SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET in GitHub secrets}"
          remote=$(python3 -c 'import sys, tomllib; print(tomllib.load(open("supabase/config.toml", "rb")).get("remotes", {}).get(sys.argv[1], {}).get("project_id", ""))' "$ENVIRONMENT")
          if [[ "$remote" != "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is $SUPABASE_PROJECT_ID, but [remotes.$ENVIRONMENT] in supabase/config.toml names ${remote:-no project}."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # The push below does not ask for confirmation here, so the log keeps what it changed.
      - name: Show what the push will change
        run: supabase config diff --project-ref "$SUPABASE_PROJECT_ID"

      # Only properties config.toml declares are written; the rest of the hosted
      # configuration is left as it is.
      - name: Apply supabase/config.toml to the hosted project
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      # What config.toml cannot say: how long a texted code works, which the Send SMS hook's
      # message states (SMS_OTP_EXPIRY_MINUTES in apps/api), that the first code confirms a
      # number, which the CLI pushes inverted (supabase/cli#6997), and the cap on emails an hour,
      # which `config push` declares unmanaged and leaves at the default of 2 (the hook counts
      # against it; see [auth.rate_limit] in config.toml). Through the Management API.
      - name: Apply the sign-in settings config.toml cannot hold
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"sms_otp_exp": 600, "sms_autoconfirm": false, "rate_limit_email_sent": 60}' \
            | jq -e '.sms_otp_exp == 600 and .sms_autoconfirm == false and .rate_limit_email_sent == 60' > /dev/null

  deploy-app:
    name: Deploy SPA
    needs: [changes, validate, test, build, deploy-api]
    # Explicitly allow a skipped API job on SPA-only releases, but never a failed one.
    if: >-
      !cancelled() &&
      needs.changes.outputs.app == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
        (needs.deploy-api.result == 'skipped' && needs.changes.outputs.api != 'true'))
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-app-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-app-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/app/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated SPA assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          command: >-
            deploy --assets .wrangler/release/dist
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  # Separate from the deployment, which is done and reported by the time this starts. The
  # checks run against the deployed environment with a real account, so they stay small; flows that create
  # users or send email are tested against a local stack on pull requests instead.
  verify-app:
    name: Verify deployed SPA
    needs: [changes, deploy-app]
    if: ${{ !cancelled() && needs.deploy-app.result == 'success' }}
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: verify-app-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      E2E_API_URL: ${{ vars.API_URL }}
      E2E_APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      # The browser download is cached by Playwright version; its system packages are not.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ssm-usor/app exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install --with-deps chromium

      - name: Install Chromium's system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ssm-usor/app exec playwright install-deps chromium

      - name: Check deployed SPA and authenticated user flow
        id: app-checks
        # Advisory during development; the deployment completed in the job before this one.
        continue-on-error: true
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm --filter @ssm-usor/app test:e2e --project=chromium --project=authenticated

      - name: Report browser verification warning
        if: ${{ !cancelled() && steps.app-checks.outcome == 'failure' }}
        run: |
          echo "::warning::SPA deployed, but browser verification did not pass. Review the Playwright results."
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ### Browser verification warning

          The SPA was deployed, but the Playwright browser checks did not pass.
          These checks are currently advisory. Review the test logs and the `playwright-app`
          artifact, if available, before treating this release as verified.
          MARKDOWN

      - name: Upload browser test report
        if: ${{ !cancelled() && steps.app-checks.outcome != 'skipped' && steps.app-checks.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-app
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
          overwrite: true

  deploy-portal:
    name: Deploy portal
    needs: [changes, validate, test, build, deploy-api]
    # Like the SPA, after the API it calls, and a skipped API job only on releases without it.
    # It does not wait for the SPA: the two share nothing at runtime.
    if: >-
      !cancelled() &&
      needs.changes.outputs.portal == 'true' &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.deploy-api.result == 'success' ||
        (needs.deploy-api.result == 'skipped' && needs.changes.outputs.api != 'true'))
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-portal-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-portal-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/portal/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated portal assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/portal
          packageManager: pnpm
          command: >-
            deploy --assets .wrangler/release/dist
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  # Nothing signs in yet, so the checks need no account and no secrets.
  verify-portal:
    name: Verify deployed portal
    needs: [changes, deploy-portal]
    if: ${{ !cancelled() && needs.deploy-portal.result == 'success' }}
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: verify-portal-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      E2E_PORTAL_URL: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      # The browser download is cached by Playwright version; its system packages are not.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ssm-usor/portal exec playwright --version | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium download
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ssm-usor/portal exec playwright install --with-deps chromium

      - name: Install Chromium's system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ssm-usor/portal exec playwright install-deps chromium

      - name: Check deployed portal
        id: portal-checks
        # Advisory during development; the deployment completed in the job before this one.
        continue-on-error: true
        run: pnpm --filter @ssm-usor/portal test:e2e

      - name: Report browser verification warning
        if: ${{ !cancelled() && steps.portal-checks.outcome == 'failure' }}
        run: |
          echo "::warning::Portal deployed, but browser verification did not pass. Review the Playwright results."
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ### Portal verification warning

          The portal was deployed, but the Playwright browser checks did not pass.
          These checks are currently advisory. Review the test logs and the `playwright-portal`
          artifact, if available, before treating this release as verified.
          MARKDOWN

      - name: Upload browser test report
        if: ${{ !cancelled() && steps.portal-checks.outcome != 'skipped' && steps.portal-checks.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-portal
          path: |
            apps/portal/playwright-report/
            apps/portal/test-results/
          retention-days: 7
          overwrite: true

  deploy-marketing:
    name: Deploy marketing site
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
    # waits its turn.
    concurrency:
      group: deploy-marketing-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.MARKETING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-marketing-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/marketing/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated marketing bundle and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/worker.js --no-bundle
            --assets .wrangler/release/dist
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"

  deploy-help:
    name: Deploy help site
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.help == 'true'
    runs-on: ubuntu-latest
    # Never beside a deployment of the same thing, and never cancelled halfway: a newer run
