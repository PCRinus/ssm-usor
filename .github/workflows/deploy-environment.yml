    concurrency:
      group: deploy-help-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.HELP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: release-help-${{ inputs.environment }}-${{ inputs.sha }}
          path: apps/help/.wrangler/release

      - name: Prepare deployment message
        id: metadata
        uses: ./.github/actions/deployment-message

      - name: Deploy validated help bundle and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/help
          packageManager: pnpm
          command: >-
            deploy .wrangler/release/worker/worker.js --no-bundle
            --assets .wrangler/release/dist
            --tag ${{ inputs.sha }}
            --message "${{ steps.metadata.outputs.message }}"
