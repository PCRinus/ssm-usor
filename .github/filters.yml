# These are deployment/build targets, not every package in the workspace.
# Keep shared build inputs conservative; lint and documentation alone do not deploy.
api:
  - &shared
    - 'package.json'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
    - '.npmrc'
    - '.nvmrc'
    - 'tsconfig.base.json'
    - 'turbo.json'
    - '.github/filters.yml'
    - '.github/actions/**'
    - '.github/workflows/**'
    - 'patches/**'
  - 'apps/api/**'
  - 'packages/contracts/**'
  - 'packages/document-engine/**'
app:
  - *shared
  - 'apps/app/**'
  - &ui
    - 'packages/ui/**'
    - 'packages/design-tokens/**'
  # The generated client is not a workspace dependency on contracts.
  - 'packages/contracts/**'
  - 'apps/api/openapi.json'
  - 'orval.config.ts'
mail:
  - *shared
  - 'apps/mail/**'
  - 'packages/contracts/**'
# The Worker that owns the Word-to-PDF container. Only its interface lives in the contracts.
pdf:
  - *shared
  - 'apps/pdf/**'
  - 'packages/contracts/src/pdf.ts'
marketing:
  - *shared
  - *ui
  - 'apps/marketing/**'
# Schema and configuration changes deploy to the hosted Supabase project from main. Both
# deployments do nothing when there is nothing to apply, so the workflow files select them
# too: a run that failed because of the workflow is then retried by the commit that fixes it.
database:
  - '.github/filters.yml'
  - '.github/actions/**'
  - '.github/workflows/**'
  - 'supabase/config.toml'
  - 'supabase/migrations/**'
