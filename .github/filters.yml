# These are deployment/build targets, not every package in the workspace.
# Keep shared build inputs conservative; lint and documentation alone do not deploy.
api:
  - &shared
    - 'package.json'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
    - '.npmrc'
    - '.nvmrc'
    - 'tsconfig.base.json'
    - 'turbo.json'
    - '.github/filters.yml'
    - '.github/actions/**'
    - '.github/workflows/**'
    - 'patches/**'
  - 'apps/api/**'
  - 'packages/contracts/**'
  - 'packages/document-engine/**'
app:
  - *shared
  - 'apps/app/**'
  - &ui
    - 'packages/ui/**'
    - 'packages/design-tokens/**'
  # The generated client is not a workspace dependency on contracts.
  - 'packages/contracts/**'
  - 'apps/api/openapi.json'
  - 'orval.config.ts'
mail:
  - *shared
  - 'apps/mail/**'
  - 'packages/contracts/**'
# Only its interface lives in the contracts.
pdf:
  - *shared
  - 'apps/pdf/**'
  - 'packages/contracts/src/pdf.ts'
marketing:
  - *shared
  - *ui
  - 'apps/marketing/**'
# Schema and configuration changes deploy to the hosted Supabase project from main. Both
# deployments do nothing when there is nothing to apply, so the workflow files select them
# too: a run that failed because of the workflow is then retried by the commit that fixes it.
database:
  - '.github/filters.yml'
  - '.github/actions/**'
  - '.github/workflows/**'
  - 'supabase/config.toml'
  - 'supabase/migrations/**'
# The built-in Word templates are uploaded to Storage and registered from main. The deployment
# workflow compares with the last deployment, so a run that is superseded hands these on.
templates:
  - '.github/filters.yml'
  - '.github/workflows/deploy.yml'
  - 'packages/document-engine/templates/**'
  - 'apps/api/scripts/register-templates.ts'
  - 'apps/api/scripts/lib/register-templates.ts'
  - 'supabase/migrations/**'
# Anything the full validation has something to say about, workflow files included, since
# running them is how they are tested. A pull request outside it, which in practice means
# documentation, only gets its formatting and lint checked.
code:
  - *shared
  - 'apps/**'
  - 'packages/**'
  - 'supabase/**'
  - 'orval.config.ts'
  - 'eslint.config.*'
  - '.prettierrc*'
  - '.prettierignore'
  - 'lefthook.yml'
